<!doctype html><html lang="de"><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1">
<title>DAGTECH Gas senden</title><body style="font-family:system-ui;max-width:760px;margin:30px auto;padding:0 16px">
<h1>DAGTECH Gas senden</h1>
<p><b>Von:</b><br><code>0xbd312e097ffd85b19dc13d520253355951fee5b3</code></p>
<p><b>An:</b><br><code>0xb93852b149d92d58879c5e4290de972a7fba036c</code></p>
<p><b>Betrag:</b> 0,01 BDAG</p><p><b>Chain:</b> 1404 (0x57c)</p>
<button id="c">1. Bitget Wallet verbinden</button>
<button id="g" disabled>2. Gas schätzen</button>
<button id="s" disabled>3. 0,01 BDAG senden</button>
<pre id="o" style="white-space:pre-wrap;word-break:break-all;border:1px solid #ccc;padding:12px"></pre>
<script>
const FROM='0xbd312e097ffd85b19dc13d520253355951fee5b3',TO='0xb93852b149d92d58879c5e4290de972a7fba036c',CHAIN='0x57c',VALUE='0x2386f26fc10000';
const o=document.getElementById('o'),g=document.getElementById('g'),s=document.getElementById('s');
function show(x){o.textContent=typeof x==='string'?x:JSON.stringify(x,null,2)}
function P(){if(window.bitkeep&&window.bitkeep.ethereum)return window.bitkeep.ethereum;if(window.ethereum)return window.ethereum;throw new Error('Bitget Wallet Provider nicht gefunden');}
async function ready(){const p=P();const a=await p.request({method:'eth_accounts'});if(!a.length)throw new Error('Keine Wallet verbunden');if(a[0].toLowerCase()!==FROM)throw new Error('Falsche Wallet: '+a[0]);const c=await p.request({method:'eth_chainId'});if(c.toLowerCase()!==CHAIN)throw new Error('Falsche Chain: '+c);return [p,a[0]]}
c.onclick=async()=>{try{const p=P();await p.request({method:'eth_requestAccounts'});const [q,a]=await ready();g.disabled=false;show({ok:true,account:a,chainId:await q.request({method:'eth_chainId'})})}catch(e){show({ok:false,message:e.message,code:e.code,data:e.data})}};
g.onclick=async()=>{try{const [p,a]=await ready();const gas=await p.request({method:'eth_estimateGas',params:[{from:a,to:TO,value:VALUE}]});s.disabled=false;show({stage:'estimateGas',ok:true,gasDecimal:parseInt(gas,16)})}catch(e){s.disabled=true;show({stage:'estimateGas',ok:false,message:e.message,code:e.code,data:e.data})}};
s.onclick=async()=>{try{const [p,a]=await ready();if(!confirm('ECHTE Transaktion vorbereiten?\n0,01 BDAG an '+TO))return;const h=await p.request({method:'eth_sendTransaction',params:[{from:a,to:TO,value:VALUE}]});show({submitted:true,txHash:h})}catch(e){show({stage:'sendTransaction',ok:false,message:e.message,code:e.code,data:e.data})}};
</script></body></html>
